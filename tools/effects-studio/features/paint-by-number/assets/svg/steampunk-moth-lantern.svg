<title id="title">Steampunk Moth Lantern — clickable paint-by-number</title>
<desc id="desc">A large jewel-winged moth glowing inside a brass lantern above a small gear medallion. Click a numbered region to toggle its suggested color. Shift-click paints every region with the same number.</desc>
<metadata id="pbn-meta"><![CDATA[{"slug": "steampunk-moth-lantern", "title": "Steampunk Moth Lantern", "desc": "A large jewel-winged moth glowing inside a brass lantern above a small gear medallion.", "tags": ["Steampunk", "Moth", "Lantern"], "palette": [{"hex": "#2d2930", "name": "Ink"}, {"hex": "#efe2ca", "name": "Parchment"}, {"hex": "#d09a38", "name": "Brass"}, {"hex": "#a96336", "name": "Copper"}, {"hex": "#745033", "name": "Bronze"}, {"hex": "#59616a", "name": "Iron"}, {"hex": "#89919a", "name": "Steel"}, {"hex": "#3f8e91", "name": "Teal glass"}, {"hex": "#71826a", "name": "Sage"}, {"hex": "#7f3e46", "name": "Burgundy"}, {"hex": "#b5aea4", "name": "Smoke"}, {"hex": "#f7f0df", "name": "Cream"}], "complexity": "Detailed"}]]></metadata>
