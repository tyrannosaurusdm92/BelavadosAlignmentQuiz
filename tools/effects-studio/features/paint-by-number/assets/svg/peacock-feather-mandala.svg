width="3" fill="#75b59a" stroke="#2d2930" stroke-linejoin="round" stroke-linecap="round"/><path class="region" data-color="6" d="M 450 450 Q 437.8 396.4 390.1 285.6 Q 424.9 401.1 450 450 Z" stroke-width="3" fill="#4f5b8d" stroke="#2d2930" stroke-linejoin="round" stroke-linecap="round"/><circle class="region" data-color="10" cx="450" cy="450" r="48" fill="#e6cc6a" stroke="#2d2930" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g>
