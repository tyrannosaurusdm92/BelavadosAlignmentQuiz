<title id="title">Curiosity Beetle Cabinet — fillable paint-by-number page</title>
<desc id="desc">Nine jewel beetles arranged in a warm Victorian specimen cabinet. Click a numbered region to apply its suggested color. Shift-click a region to clear it.</desc>
