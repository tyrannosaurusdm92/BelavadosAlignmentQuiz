<title id="title">Xbox Controller — clickable paint-by-number</title>
<desc id="desc">A cozy paint-by-number interpretation of an Xbox-style controller with asymmetric sticks and colorful face buttons. Click a numbered region to toggle its suggested color. Shift-click paints every region with the same number.</desc>
<metadata id="pbn-meta"><![CDATA[{"slug": "xbox-controller", "title": "Xbox Controller", "desc": "A cozy paint-by-number interpretation of an Xbox-style controller with asymmetric sticks and colorful face buttons.", "tags": ["Gamer", "Controller", "Xbox"], "palette": [{"hex": "#2d2930", "name": "Ink"}, {"hex": "#f3eadb", "name": "Cream"}, {"hex": "#393c45", "name": "Console charcoal"}, {"hex": "#6c7480", "name": "Steel"}, {"hex": "#55a84f", "name": "Xbox green"}, {"hex": "#35c8d7", "name": "Neon cyan"}, {"hex": "#8155b6", "name": "Electric violet"}, {"hex": "#d96363", "name": "Hot coral"}, {"hex": "#d6a43e", "name": "Gold"}, {"hex": "#7d533b", "name": "Wood"}, {"hex": "#26384d", "name": "Shadow navy"}, {"hex": "#fffaf1", "name": "White"}], "complexity": "Moderate"}]]></metadata>
