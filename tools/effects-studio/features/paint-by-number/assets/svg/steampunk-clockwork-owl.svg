<title id="title">Steampunk Clockwork Owl — clickable paint-by-number</title>
<desc id="desc">A brass-and-copper owl with gearwork breastplate and glassy teal eyes. Click a numbered region to toggle its suggested color. Shift-click paints every region with the same number.</desc>
