<title id="title">Gamer Dungeon Desk — clickable paint-by-number</title>
<desc id="desc">A cozy battlestation with fantasy monitor scene, tower PC, controller, candles, and scattered dice. Click a numbered region to toggle its suggested color. Shift-click paints every region with the same number.</desc>
