<title id="title">Mushroom Moon Cauldron — clickable paint-by-number</title>
<desc id="desc">A moonlit cauldron bubbling beneath a giant spotted mushroom and tiny forest caps. Click a numbered region to toggle its suggested color. Shift-click paints every region with the same number.</desc>
