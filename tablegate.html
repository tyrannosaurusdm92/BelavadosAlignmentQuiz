<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#001010">
  <meta name="description" content="TableGate — a completely free TTRPG community, campaign, character, session, creator, and safety platform.">
  <title>TableGate</title>
  <link rel="icon" href="assets/images/tablegate/icons/favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/tablegate/icons/tablegate-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/tablegate/shell/tokens.css">
  <link rel="stylesheet" href="css/tablegate/shell/app.css">
  <link rel="stylesheet" href="css/tablegate/shell/components.css">
  <link rel="stylesheet" href="css/tablegate/shell/responsive.css">
  <link rel="stylesheet" href="css/tablegate/shell/workspaces.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div id="authRoot" class="auth-shell" aria-live="polite"></div>
  <div id="appRoot" class="app-shell" hidden>
    <aside id="appRail" class="app-rail" aria-label="TableGate navigation"></aside>
    <aside id="contextRail" class="context-rail" aria-label="Current section"></aside>
    <section class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="mainContent" class="main-content" tabindex="-1"></main>
      <footer id="composerRoot" class="composer-root" hidden></footer>
    </section>
    <aside id="detailRail" class="detail-rail" aria-label="Members and details"></aside>
    <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toastRoot" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <div id="liveRegion" class="sr-only" aria-live="polite"></div>
  <noscript><div class="noscript">TableGate requires JavaScript for campaign, messaging, character, session, and creator tools.</div></noscript>
  <div id="bootStatus" role="status" aria-live="polite" style="position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:24px;background:#001010;color:#f2ffff;font:700 16px/1.5 system-ui;text-align:center">
    <div><strong style="display:block;color:#00ffff;font-size:26px">Starting TableGate</strong><span>Loading the account and community shell…</span></div>
  </div>
  <script>
    window.TableGateBoot = {
      ready() {
        const status = document.getElementById('bootStatus');
        if (status) status.remove();
        document.documentElement.dataset.tablegateBoot = 'ready';
      },
      fail() {
        const status = document.getElementById('bootStatus');
        if (!status) return;
        status.innerHTML = '<div style="max-width:680px"><strong style="display:block;color:#ffb3ba;font-size:24px">TableGate could not start</strong><p>The frontend files are incomplete or an older cached copy is still active.</p><button type="button" id="clearTableGateCache" style="padding:10px 14px;border:1px solid #00ffff;background:#07343c;color:#fff;border-radius:8px;font:inherit;cursor:pointer">Clear old frontend cache and reload</button></div>';
        document.getElementById('clearTableGateCache')?.addEventListener('click', async () => {
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(registration => registration.unregister()));
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.filter(key => key.startsWith('tablegate-')).map(key => caches.delete(key)));
            }
          } catch (_) {}
          location.reload();
        });
      }
    };
    window.setTimeout(() => {
      if (document.documentElement.dataset.tablegateBoot !== 'ready') window.TableGateBoot.fail();
    }, 15000);
  </script>
  <script src="js/tablegate/shell/tablegate-shell.bundle.js" onerror="window.TableGateBoot.fail()"></script>
</body>
</html>
