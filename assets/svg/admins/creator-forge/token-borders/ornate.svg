  <metadata data-frame-format="true">{"format":"tablegate-frame-512-v1","canvas":[512,512],"center":[256,256],"sourceViewBox":[0.0,0.0,512.0,512.0],"reactionSlot":{"position":"top-center","defaultReaction":null}}</metadata>
