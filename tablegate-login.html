<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#001010">
  <meta name="description" content="TableGate — a completely free TTRPG community, campaign, character, session, creator, and safety platform.">
  <title>TableGate</title>
  <link rel="icon" href="assets/images/tablegate/icons/favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/tablegate/icons/tablegate-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/tablegate/shell/tokens.css">
  <link rel="stylesheet" href="css/tablegate/shell/app.css">
  <link rel="stylesheet" href="css/tablegate/shell/components.css">
  <link rel="stylesheet" href="css/tablegate/shell/responsive.css">
  <link rel="stylesheet" href="css/tablegate/shell/workspaces.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div id="authRoot" class="auth-shell" aria-live="polite"></div>
  <div id="appRoot" class="app-shell" hidden>
    <aside id="appRail" class="app-rail" aria-label="TableGate navigation"></aside>
    <aside id="contextRail" class="context-rail" aria-label="Current section"></aside>
    <section class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="mainContent" class="main-content" tabindex="-1"></main>
      <footer id="composerRoot" class="composer-root" hidden></footer>
    </section>
    <aside id="detailRail" class="detail-rail" aria-label="Members and details"></aside>
    <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toastRoot" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <div id="liveRegion" class="sr-only" aria-live="polite"></div>
  <noscript><div class="noscript">TableGate requires JavaScript for campaign, messaging, character, session, and creator tools.</div></noscript>
  <script type="module" src="js/tablegate/shell/app.js"></script>
</body>
</html>
