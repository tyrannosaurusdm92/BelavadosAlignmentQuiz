<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Onyx Bot-Controlled 3D Dice Table</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05080d;color:#eef8ff;}
    body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;}
    #diceRoller{position:absolute;inset:0;z-index:0!important;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(57,150,190,.14),rgba(0,0,0,.75) 62%),url('assets/background.svg') center/cover no-repeat;}
    #diceRollerUI{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;pointer-events:none;z-index:10;}
    .top_field{padding:10px 12px;text-align:center;}
    #textInput{pointer-events:auto;max-width:min(92vw,760px);width:auto;min-width:120px;text-align:center;border:1px solid rgba(145,225,255,.38);border-radius:999px;background:rgba(0,0,0,.46);color:#e9fbff;font-weight:800;box-shadow:0 0 16px rgba(85,210,255,.16);}
    #center_div{display:grid;place-items:center;}
    #instructions{display:none!important;}
    #numPad{display:none!important;}
    .bottom_field{padding:10px 12px;text-align:center;background:linear-gradient(180deg,transparent,rgba(0,0,0,.52));}
    #result{display:inline-block;max-width:min(92vw,720px);padding:8px 12px;border:1px solid rgba(145,225,255,.25);border-radius:12px;background:rgba(0,0,0,.45);color:#eef8ff;line-height:1.3;box-shadow:0 0 18px rgba(80,190,255,.12);}
    #result small{color:#bdd9e3;}
    #diceLimit{position:absolute;top:55px;left:50%;transform:translateX(-50%);z-index:20;padding:8px 12px;border-radius:12px;background:rgba(70,0,0,.82);border:1px solid rgba(255,120,120,.5);color:#fff;}
  </style>
</head>
<body onload="main.init()">
  <div id="diceRoller"></div>
  <main id="diceRollerUI">
    <div class="top_field"><input type="text" id="textInput" spellcheck="false" inputmode="none" virtualkeyboardpolicy="manual" value="1d20" /></div>
    <div id="diceLimit" style="display:none">Too many dice for the 3D table.<br>[Visual limit: 20]</div>
    <div id="center_div" class="center_field"></div>
    <div id="numPad" class="center_field" style="display:none"></div>
    <div class="bottom_field"><span id="result"></span></div>
  </main>
  <script src="libs/three.min.js"></script>
  <script src="libs/cannon.min.js"></script>
  <script src="libs/teal.js"></script>
  <script src="dice.js"></script>
  <script src="belavados-main-bot.js"></script>
</body>
</html>
